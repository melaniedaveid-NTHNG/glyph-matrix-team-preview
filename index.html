<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Glyph Matrix Lab · Team preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#242620;font-family:Arial,Helvetica,sans-serif}.gate{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:420px;border:1px solid #dcded4;border-radius:14px;background:#fafaf6;padding:36px}.label{font:11px monospace;letter-spacing:1.5px;color:#7a7c72}h1{font-size:30px;font-weight:400;letter-spacing:-1px;margin:17px 0 12px}p{font-size:13px;color:#73776a;line-height:1.6}label{display:block;font-size:12px;margin:26px 0 9px}.inputrow{display:flex;border:1px solid #c9cdc1;border-radius:6px;overflow:hidden;background:#fff}input{min-width:0;flex:1;border:0;padding:13px;font-size:16px;background:transparent;outline-offset:-3px}.show{background:transparent;border:0;padding:0 13px;color:#5f6456;cursor:pointer}.submit{margin-top:14px;border:0;border-radius:6px;width:100%;padding:14px;background:#292c25;color:white;cursor:pointer;font:13px Arial}.submit:disabled{opacity:.6}.error{font-size:12px;min-height:20px;color:#a3261e;margin:12px 0 0}iframe{position:fixed;inset:0;border:0;width:100%;height:100svh;background:#f5f5f0}.lock{position:fixed;z-index:5;right:14px;bottom:14px;border:1px solid #c7cbbf;border-radius:20px;padding:9px 15px;background:#fafaf6;color:#333;font:11px monospace;cursor:pointer}[hidden]{display:none!important}</style></head><body><main class="gate" id="gate"><section class="card"><div class="label">GLYPH / TEAM PREVIEW</div><h1>A little light.<br>A lot of possibility.</h1><p>Enter your team password to open the matrix simulator.</p><form id="form"><label for="password">Team password</label><div class="inputrow"><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button class="show" type="button" id="show" aria-label="Show password" aria-pressed="false">Show</button></div><button class="submit" type="submit" id="unlock">Open simulator →</button><p class="error" id="error" role="alert" aria-live="polite"></p></form></section></main><button class="lock" id="lock" hidden>Lock preview</button><script src="unlock.js"></script></body></html>
